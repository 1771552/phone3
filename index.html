<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OC 폰 서랍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: a drawer of phones (library) → one phone on a stage with a slim control rail. The device itself is a fixed iOS-like world. */
:root{
  --bg:#e9ebf2; --panel:#ffffff; --ink:#1a1c25; --mute:#676c7e; --line:#d6d9e4; --sunk:#e1e4ee;
  --accent:#4f52c9; --accent-ink:#ffffff; --danger:#c93c3c; --ok:#2f8f5b;
  --f-ui:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-disp:"Gowun Batang","Nanum Myeongjo",serif;
  --f-phone:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","IBM Plex Sans KR","Malgun Gothic",sans-serif;
  /* device palette: deliberately fixed, like real iOS light mode */
  --ios-bg:#ffffff; --ios-grp:#f2f2f7; --ios-ink:#000000; --ios-sec:#8a8a8e; --ios-sep:#c6c6c8; --ios-blue:#007aff; --ios-bub:#e9e9eb; --ios-green:#34c759; --ios-red:#ff3b30;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13141a; --panel:#1d1f28; --ink:#eceef6; --mute:#9ba0b3; --line:#2d303d; --sunk:#262935;
  --accent:#9a9cff; --accent-ink:#14152a; --danger:#ff7676; --ok:#5fd093; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13141a; --panel:#1d1f28; --ink:#eceef6; --mute:#9ba0b3; --line:#2d303d; --sunk:#262935;
  --accent:#9a9cff; --accent-ink:#14152a; --danger:#ff7676; --ok:#5fd093; color-scheme:dark}

[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
html:has(body.in-phone),body.in-phone,body.in-phone #app{height:100%;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea,select{font:inherit;color:inherit}

/* ---------- shared controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--mute)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn.row{width:100%;justify-content:space-between;margin-top:10px}
.btn.row.add{justify-content:center;border-style:dashed}

/* ---------- library ---------- */
.lib{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:40px 64px}
.lib-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:32px}
.eyebrow{margin:0 0 4px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
.lib-head h1{font-family:var(--f-disp);font-size:clamp(30px,5vw,44px);line-height:1.15;margin:0;text-wrap:balance}
.lede{margin:8px 0 0;color:var(--mute);max-width:48ch}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:28px 22px}
.card{display:flex;flex-direction:column;gap:10px;min-width:0}
.mini{position:relative;aspect-ratio:9/19;width:100%;max-width:100%;border-radius:26px;border:6px solid #15161b;box-shadow:0 18px 30px -18px rgba(20,22,40,.55);overflow:hidden;color:#fff;display:flex;flex-direction:column;align-items:center;padding-top:22%;text-shadow:0 1px 8px rgba(0,0,0,.25);transition:transform .18s}
.mini:hover{transform:translateY(-3px)}
.mini.ink{color:#111;text-shadow:none}
.mini-date{font-size:12px;font-weight:600;font-family:var(--f-phone)}
.mini-time{font-size:44px;font-weight:700;line-height:1;font-family:var(--f-phone);font-variant-numeric:tabular-nums}
.mini::before{content:"";position:absolute;top:7px;left:50%;transform:translateX(-50%);width:34%;height:11px;border-radius:8px;background:#000}
.card-meta{display:flex;flex-direction:column;min-width:0}
.card-meta b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-meta span{font-size:13px;color:var(--mute)}
.card-acts{display:flex;flex-wrap:wrap;gap:6px}
.empty{grid-column:1/-1;border:1.5px dashed var(--line);border-radius:18px;padding:40px 24px;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.sec{margin-bottom:44px}
.sec-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
.sec-head h2{font-family:var(--f-disp);font-size:24px;margin:0}
.sec-head p{margin:4px 0 0;color:var(--mute);font-size:14px;max-width:52ch}
.notice{margin:0 0 24px;padding:12px 14px;border-radius:12px;background:var(--sunk);color:var(--mute);font-size:14px}

/* ---------- studio (one phone) ---------- */
.studio{height:100%;display:flex;gap:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.rail{width:220px;flex:none;display:flex;flex-direction:column;gap:10px;min-width:0}
.rail-name{padding:6px 2px 4px}
.rail-name b{display:block;font-family:var(--f-disp);font-size:22px;line-height:1.25;overflow-wrap:anywhere}
.rail-name span{color:var(--mute);font-size:13px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:10px;padding:3px}
.seg button{border:0;background:none;border-radius:8px;padding:7px 0;font-weight:600;font-size:14px;color:var(--mute)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.hint{font-size:13px;color:var(--mute);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin:4px 0 0}
.hint b{color:var(--ink)}
.hint ul{margin:6px 0 0;padding-left:18px}
.savestate{font-size:12px;color:var(--mute);min-height:18px}
.stage{flex:1;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center}
.pbox{position:relative;flex:none}
@media (max-width:760px){
  .studio{flex-direction:column;gap:10px;padding-block:10px}
  .rail{width:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px}
  .rail-name{display:none}
  .seg{flex:1;min-width:150px}
  .hint{display:none}
  .savestate{width:100%;min-height:0;order:9}
}

/* ---------- full-screen phone on small screens ---------- */
body.fullphone .studio{padding:0;gap:0}
body.fullphone .rail{padding:8px max(12px,env(safe-area-inset-left,0px)) 8px max(12px,env(safe-area-inset-right,0px))}
body.fullphone.viewer .rail{display:none}
body.fullphone .stage{align-items:flex-start;background:#000}
body.fullphone .phone{width:390px;height:844px;padding:0;border-radius:0;background:none;box-shadow:none}
body.fullphone .screen{border-radius:0}
body.fullphone.viewer{background:#000}

/* ---------- device frame ---------- */
.phone{position:absolute;top:0;left:0;width:414px;height:868px;transform-origin:0 0;border-radius:66px;background:#17171b;padding:12px;box-shadow:inset 0 0 0 2px #3b3b42,inset 0 0 0 5px #0b0b0d,0 40px 70px -30px rgba(15,16,35,.55)}
.screen{position:relative;width:390px;height:844px;border-radius:54px;overflow:hidden;background:#000;font-family:var(--f-phone);font-size:17px;line-height:1.35;color:var(--ios-ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
.screen button{background:none;border:0;padding:0;text-align:inherit}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;border-radius:20px;background:#000;z-index:40;pointer-events:none}
.sb{position:absolute;inset:0 0 auto;height:54px;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 44px;color:#fff;font-weight:600;font-size:16px;z-index:35;pointer-events:none}
.sb.dk{color:#000}
.sb-r{display:flex;align-items:center;gap:6px}
.sb-car{font-size:14px;font-weight:600}
.bat{width:26px;height:12.5px;border:1.4px solid currentColor;border-radius:4px;padding:1.4px;position:relative;opacity:.95}
.bat::after{content:"";position:absolute;right:-3.6px;top:3.2px;width:1.8px;height:4px;border-radius:0 1px 1px 0;background:currentColor}
.bat i{display:block;height:100%;border-radius:1.6px;background:currentColor}
.homebar{position:absolute;left:0;right:0;bottom:0;height:28px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px!important;z-index:45}
.homebar i{width:134px;height:5px;border-radius:3px;background:#fff;display:block}
.homebar.dk i{background:#000}
.view{position:absolute;inset:0}

/* lock */
.lock{position:absolute;inset:0;color:#fff;display:flex;flex-direction:column;align-items:center;user-select:none;touch-action:none}
.lock.ink{color:#111}
.lock-clock{margin-top:76px;text-align:center;text-shadow:0 1px 12px rgba(0,0,0,.18)}
.lock.ink .lock-clock{text-shadow:none}
.lock-date{font-size:21px;font-weight:600}
.lock-time{font-size:96px;font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.notifs{margin-top:auto;width:100%;padding:0 10px 14px;display:flex;flex-direction:column;gap:8px}
.notif{width:100%;text-align:left!important;background:rgba(245,245,250,.72)!important;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#000;border-radius:20px;padding:12px 14px!important;font-size:15px}
.nt-h{display:flex;align-items:center;gap:7px;font-size:13px;color:#3c3c43}
.nt-h b{font-weight:600;color:#000;flex:1}
.nt-ic{width:20px;height:20px;border-radius:5px;background:linear-gradient(180deg,#67f27f,#25c541)}
.nt-t{font-weight:600;margin-top:4px}
.nt-b{color:#222;white-space:pre-wrap}
.lock-foot{width:100%;display:flex;align-items:center;justify-content:space-between;padding:0 46px 46px}
.lk-btn{width:50px;height:50px;border-radius:50%;background:rgba(30,30,40,.35);backdrop-filter:blur(12px);display:grid;place-items:center;color:#fff}
.lock-hint{font-size:14px;font-weight:600;opacity:.92;color:inherit}
.edfab{position:absolute;z-index:30;left:50%;transform:translateX(-50%);top:270px;background:var(--ios-blue)!important;color:#fff!important;font-weight:600!important;font-size:15px;padding:9px 16px!important;border-radius:20px;box-shadow:0 6px 18px rgba(0,60,160,.35)}
.edfab.low{top:auto;bottom:118px}

/* passcode */
.pass{position:absolute;inset:0;color:#fff}
.pass-dim{position:absolute;inset:0;backdrop-filter:blur(26px) saturate(1.2);-webkit-backdrop-filter:blur(26px);background:rgba(20,20,30,.45)}
.pass-in{position:relative;display:flex;flex-direction:column;align-items:center;padding-top:120px;height:100%}
.pass-t{font-size:20px;font-weight:500}
.dots{display:flex;gap:22px;margin:20px 0 52px}
.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid #fff}
.dots i.on{background:#fff}
.keys{display:grid;grid-template-columns:repeat(3,78px);gap:16px 26px}
.key{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.2)!important;color:#fff;display:flex!important;flex-direction:column;align-items:center;justify-content:center;text-align:center!important}
.key:active{background:rgba(255,255,255,.45)!important}
.key b{font-size:34px;font-weight:400;line-height:1}
.key small{font-size:10px;letter-spacing:.18em;font-weight:600;margin-top:2px}
.key.z{grid-column:2}
.pass-foot{margin-top:auto;width:100%;display:flex;justify-content:space-between;padding:0 60px 60px;font-size:17px}
.pass-foot button{color:#fff}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}

/* home */
.home{position:absolute;inset:0;padding-top:64px;display:flex;flex-direction:column}
.home-in{flex:1;padding:10px 22px 0;display:flex;flex-direction:column;gap:22px;overflow:hidden}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 0;justify-items:center}
.appi{display:flex!important;flex-direction:column;align-items:center;gap:6px;width:76px}
.ic{width:62px;height:62px;border-radius:15px;display:grid;place-items:center;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.ic svg{width:100%;height:100%}
.ic img{width:100%;height:100%;object-fit:cover}
.al{font-size:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35);max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.home.ink .al{color:#111;text-shadow:none}
.appi:active .ic{filter:brightness(.8)}
.dock{margin:0 12px 22px;padding:16px 14px;border-radius:32px;background:rgba(255,255,255,.28);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);display:flex;justify-content:space-around;min-height:94px}
.wd{border-radius:22px;height:156px;padding:16px 18px;overflow:hidden;position:relative;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.wd-clock{background:rgba(255,255,255,.88);color:#000;display:flex;flex-direction:column;justify-content:space-between}
.wd-clock small{color:var(--ios-red);font-weight:700;font-size:14px}
.wd-clock b{font-size:54px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.wd-text{background:#fffef4;color:#1c1c1e}
.wd-text small{display:block;color:#d9a400;font-weight:700;font-size:14px;margin-bottom:4px}
.wd-text p{margin:0;white-space:pre-wrap;font-size:15px;line-height:1.4}
.wd-photo{padding:0;background:#ccc}
.wd-photo img{width:100%;height:100%;object-fit:cover;display:block}

/* app chrome */
.app{position:absolute;inset:0;background:var(--ios-bg);display:flex;flex-direction:column;padding-top:54px}
.app.grp{background:var(--ios-grp)}
.nav{height:44px;flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 8px}
.nav>div:first-child{justify-self:start}
.nt{font-weight:600;font-size:17px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nr{justify-self:end;display:flex;gap:6px;align-items:center}
.nb{color:var(--ios-blue);font-size:17px;display:inline-flex!important;align-items:center;gap:5px;padding:6px 6px!important}
.nb svg{flex:none}
.nb.ed{font-size:14px;font-weight:600;background:rgba(0,122,255,.12)!important;border-radius:15px;padding:5px 11px!important}
.lt{font-size:34px;font-weight:700;margin:0;padding:0 16px 8px;letter-spacing:-.02em}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:40px;scrollbar-width:none;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}
.sbar{margin:0 16px 12px;background:rgba(118,118,128,.12);border-radius:10px;height:36px;display:flex;align-items:center;gap:6px;padding:0 10px;color:var(--ios-sec);font-size:17px}
.grpl{background:#fff;border-radius:12px;margin:0 16px 24px;overflow:hidden}
.app:not(.grp) .grpl{background:var(--ios-grp)}
.gh{margin:0 32px 6px;font-size:13px;color:var(--ios-sec);text-transform:uppercase}
.gr{display:flex!important;align-items:center;gap:12px;min-height:46px;padding:8px 16px!important;width:100%;text-align:left!important;position:relative;font-size:17px}
.gr+.gr::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--ios-sep)}
.gr .gv{margin-left:auto;color:var(--ios-sec);font-size:16px;display:flex;align-items:center;gap:6px;min-width:0;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gr .gi{width:30px;height:30px;border-radius:7px;flex:none;overflow:hidden;display:grid;place-items:center}
.gr .gi svg{width:100%;height:100%}
.chev{color:#c4c4c7;flex:none}
.empty-in{padding:60px 30px;text-align:center;color:var(--ios-sec);font-size:15px}
.empty-in b{display:block;color:#000;font-size:20px;margin-bottom:6px}
.edhint{margin:0 16px 16px;padding:10px 12px;border-radius:12px;background:rgba(0,122,255,.08);color:#0a4fa8;font-size:13px;line-height:1.45}

/* avatar */
.av{border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:600;overflow:hidden;background:linear-gradient(180deg,#a8adb6,#858a93)}
.av img{width:100%;height:100%;object-fit:cover}

/* messages */
.tl-row{display:flex!important;gap:12px;align-items:center;padding:8px 16px!important;width:100%;text-align:left!important;position:relative}
.tl-mid{flex:1;min-width:0;padding:4px 0 10px;border-bottom:.5px solid var(--ios-sep)}
.tl-top{display:flex;justify-content:space-between;gap:8px}
.tl-top b{font-weight:600;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-top span{color:var(--ios-sec);font-size:15px;white-space:nowrap}
.tl-prev{color:var(--ios-sec);font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3;margin-top:1px}
.pin-dot{position:absolute;left:5px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--ios-blue)}
.chat{background:#fff}
.chat-head{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 8px 6px;border-bottom:.5px solid var(--ios-sep);background:rgba(249,249,249,.94)}
.ch-who{display:flex!important;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:#000}
.ch-who span{display:flex;align-items:center;gap:2px}
.chatlog{padding:10px 12px 16px;display:flex;flex-direction:column;gap:2px}
.cdate{align-self:center;font-size:12px;color:var(--ios-sec);margin:12px 0 6px;font-weight:500;padding:0 6px!important;border-radius:6px}
.brow{display:flex;flex-direction:column}
.brow.me{align-items:flex-end}
.brow.them{align-items:flex-start}
.bub{max-width:262px;padding:7px 13px!important;border-radius:19px;font-size:17px;line-height:1.3;white-space:pre-wrap;overflow-wrap:anywhere;text-align:left!important;position:relative}
.me .bub{background:var(--ios-blue)!important;color:#fff}
.them .bub{background:var(--ios-bub)!important;color:#000}
.bub.pic{padding:0!important;background:none!important;overflow:hidden}
.bub img{display:block;max-width:220px;max-height:280px;border-radius:16px;object-fit:cover}
.bub.pic img{border-radius:18px}
.bub img+span{display:block;margin-top:6px}
.brow.end{margin-bottom:8px}
.btime{font-size:11px;color:var(--ios-sec);margin:2px 6px 0}
.bub.ed-on{outline:1.5px dashed rgba(0,122,255,.5);outline-offset:2px}
.typing{display:flex;gap:4px;padding:12px 14px;background:var(--ios-bub);border-radius:19px;width:max-content}
.typing i{width:8px;height:8px;border-radius:50%;background:#9a9aa0;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
.tempnote{align-self:center;margin-top:10px;font-size:12px;color:var(--ios-sec);display:flex;gap:6px;align-items:center}
.tempnote button{color:var(--ios-blue);font-size:12px;font-weight:600}
.readmark{align-self:flex-end;font-size:11px;color:var(--ios-sec);margin:1px 6px 4px}
.composer{flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px 36px;background:rgba(249,249,249,.94);border-top:.5px solid var(--ios-sep)}
.composer input{flex:1;min-width:0;height:36px;border:1px solid #c7c7cc;border-radius:18px;padding:0 14px;font-size:16px;background:#fff;outline:none}
.send{width:32px;height:32px;border-radius:50%;background:var(--ios-blue)!important;color:#fff;display:grid!important;place-items:center;flex:none}
.plus{width:32px;height:32px;border-radius:50%;background:#e5e5ea!important;color:#555;font-size:22px;line-height:1;display:grid!important;place-items:center;flex:none}
.who{display:flex;background:#e5e5ea;border-radius:9px;padding:2px;flex:none}
.who button{font-size:13px;font-weight:600;padding:5px 8px!important;border-radius:7px;color:#555}
.who button.on{background:#fff;color:#000;box-shadow:0 1px 2px rgba(0,0,0,.15)}

/* photos */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.pt{aspect-ratio:1;position:relative;overflow:hidden;background:#e4e4e8!important;display:block!important;width:100%}
.pt img{width:100%;height:100%;object-fit:cover;display:block}
.pt .fav{position:absolute;left:6px;bottom:4px;color:#fff;font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.pt.add{display:grid!important;place-items:center;color:var(--ios-blue);font-size:30px;background:#eef4ff!important}
.pcount{text-align:center;font-size:13px;color:var(--ios-sec);margin:14px 0}
.viewer{background:#000;color:#fff}
.viewer .nb{color:#fff}
.pv{flex:1;display:grid;place-items:center;min-height:0;overflow:hidden}
.pv img{max-width:100%;max-height:100%;object-fit:contain}
.pv-cap{padding:12px 20px 6px;font-size:15px;white-space:pre-wrap}
.pv-cap small{display:block;color:#9a9aa0;font-size:13px}
.pv-bar{display:flex;justify-content:center;padding:6px 0 40px}
.pv-bar button{color:#fff;font-size:26px}

/* notes */
.nrow{display:block!important;width:100%;text-align:left!important;padding:10px 16px!important;position:relative}
.nrow+.nrow::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--ios-sep)}
.nrow b{display:block;font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nrow span{font-size:15px;color:var(--ios-sec);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nrow span em{font-style:normal;color:#3c3c43;margin-right:8px}
.notesapp .nb{color:#d9a400}
.notesapp .nb.ed{background:rgba(217,164,0,.14)!important}
.note-doc{padding:4px 20px 40px}
.note-doc .nd{text-align:center;font-size:13px;color:var(--ios-sec);margin-bottom:10px}
.note-doc h2{font-size:26px;margin:0 0 8px;font-weight:700}
.note-doc p{margin:0;white-space:pre-wrap;font-size:17px;line-height:1.45}
.inplace{width:100%;border:0;outline:none;background:transparent;resize:none;padding:0}
.inplace.h{font-size:26px;font-weight:700;margin-bottom:8px}
.inplace.b{font-size:17px;line-height:1.45;min-height:420px}
.inplace:focus{background:rgba(255,214,10,.08)}

/* web */
.web{background:#f2f2f7}
.web-start{padding:8px 0 120px}
.web-start h3{font-size:22px;font-weight:700;margin:6px 18px 12px}
.favs{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px;padding:0 14px 24px}
.fav-t{display:flex!important;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:#3c3c43;text-align:center!important;min-width:0}
.fav-t i{width:60px;height:60px;border-radius:14px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1);display:grid;place-items:center;font-style:normal;font-size:26px;font-weight:700;color:#3a6fd8;overflow:hidden}
.fav-t i img{width:100%;height:100%;object-fit:cover}
.fav-t span{max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow{display:flex!important;align-items:center;gap:10px;width:100%;padding:11px 16px!important;text-align:left!important;font-size:16px;position:relative}
.hrow+.hrow::before{content:"";position:absolute;top:0;left:44px;right:0;border-top:.5px solid var(--ios-sep)}
.hrow svg{color:var(--ios-sec);flex:none}
.addr{position:absolute;left:0;right:0;bottom:0;padding:8px 12px 34px;background:rgba(249,249,249,.95);backdrop-filter:blur(16px);border-top:.5px solid var(--ios-sep);z-index:5}
.addr form{display:flex;align-items:center;gap:6px;background:#fff;border-radius:12px;height:44px;padding:0 12px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.addr input{flex:1;min-width:0;border:0;outline:none;font-size:16px;text-align:center;background:transparent}
.addr input:focus{text-align:left}
.addr-tools{display:flex;justify-content:space-around;padding-top:8px;color:var(--ios-blue)}
.addr-tools button{color:var(--ios-blue);padding:4px 14px!important}
.page{background:#fff;padding:14px 20px 140px}
.pg-url{font-size:12px;color:var(--ios-sec);margin-bottom:12px}
.page h1{font-size:28px;line-height:1.2;margin:0 0 12px}
.page img{width:100%;border-radius:12px;margin-bottom:14px;display:block}
.pg-body{white-space:pre-wrap;font-size:17px;line-height:1.55;color:#1c1c1e}
.sres{padding:8px 0 140px;background:#fff}
.sres-row{display:block!important;width:100%;text-align:left!important;padding:12px 18px!important;border-bottom:.5px solid var(--ios-sep)}
.sres-row small{color:#1e7a3c;font-size:13px}
.sres-row b{display:block;color:#1a0dab;font-size:18px;font-weight:500}
.sres-row span{display:block;color:#4d5156;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* music */
.musicapp .nb{color:#c03bd6}
.musicapp .nb.ed{background:rgba(192,59,214,.12)!important}
.trow{display:flex!important;align-items:center;gap:12px;width:100%;padding:7px 16px!important;text-align:left!important}
.cov{border-radius:8px;flex:none;overflow:hidden;display:grid;place-items:center;color:rgba(255,255,255,.85)}
.cov img{width:100%;height:100%;object-fit:cover}
.tm{flex:1;min-width:0;border-bottom:.5px solid var(--ios-sep);padding:6px 0 10px}
.tm b{display:block;font-weight:500;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm span{font-size:14px;color:var(--ios-sec)}
.tm.on b{color:#c03bd6}
.minip{flex:none;margin:0 8px 30px;padding:8px 12px 8px 8px!important;display:flex!important;align-items:center;gap:12px;background:rgba(245,245,247,.97)!important;border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,.12);text-align:left!important}
.minip b{flex:1;font-weight:500;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player{position:absolute;inset:0;padding:70px 32px 50px;display:flex;flex-direction:column;color:#fff}
.player .nb{color:#fff}
.bigcov{width:100%;aspect-ratio:1;max-width:100%;border-radius:12px;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.35);margin:20px 0 28px;transition:transform .4s}
.bigcov.paused{transform:scale(.86)}
.bigcov img{width:100%;height:100%;object-fit:cover}
.pl-t b{display:block;font-size:22px;font-weight:600}
.pl-t span{font-size:20px;opacity:.7}
.prog{height:6px;border-radius:3px;background:rgba(255,255,255,.25);margin:26px 0 6px;overflow:hidden}
.prog i{display:block;height:100%;background:rgba(255,255,255,.85);width:0}
.ptimes{display:flex;justify-content:space-between;font-size:12px;opacity:.7;font-variant-numeric:tabular-nums}
.ctrl{display:flex;justify-content:space-around;align-items:center;margin-top:26px}
.ctrl button{color:#fff}
.bars{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.bars i{width:3px;background:#c03bd6;border-radius:1px;height:40%}
.bars.go i{animation:eq .9s infinite ease-in-out}
.bars.go i:nth-child(2){animation-delay:.2s}.bars.go i:nth-child(3){animation-delay:.4s}
@keyframes eq{50%{height:100%}}

/* sns */
.sns-top{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 10px}
.sns-top b{font-size:22px;font-weight:700}
.prof{display:flex;align-items:center;gap:22px;padding:4px 16px 12px}
.stats{flex:1;display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.stats b{display:block;font-size:17px;font-weight:700}
.stats span{font-size:13px}
.bio{padding:0 16px 12px;font-size:14px;white-space:pre-wrap}
.bio b{display:block;font-size:14px}
.sns-btns{display:flex;gap:6px;padding:0 16px 14px}
.sns-btns button{flex:1;background:#efefef!important;border-radius:8px;padding:7px 0!important;font-size:14px;font-weight:600;text-align:center!important}
.sns-btns button.blue{background:#3b82f6!important;color:#fff}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;border-top:.5px solid var(--ios-sep);padding-top:2px}
.sp{aspect-ratio:1;overflow:hidden;position:relative;display:block!important;width:100%;color:#fff;font-size:13px;padding:10px!important;text-align:left!important}
.sp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.post-h{display:flex;align-items:center;gap:10px;padding:8px 14px;font-size:14px;font-weight:600}
.post-img{width:100%;aspect-ratio:1;max-width:100%;overflow:hidden;color:#fff;display:grid;place-items:center;font-size:20px;padding:30px;text-align:center}
.post-img img{width:100%;height:100%;object-fit:cover}
.post-act{display:flex;gap:16px;padding:10px 14px 4px;align-items:center}
.post-act button{display:flex!important}
.post-txt{padding:0 14px;font-size:14px}
.post-txt p{margin:4px 0;white-space:pre-wrap}
.post-txt small{color:var(--ios-sec)}

/* mail */
.mrow{display:flex!important;gap:8px;width:100%;text-align:left!important;padding:10px 16px 10px 8px!important;position:relative}
.mrow+.mrow::before{content:"";position:absolute;top:0;left:28px;right:0;border-top:.5px solid var(--ios-sep)}
.udot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
.udot.on{background:var(--ios-blue)}
.mm{flex:1;min-width:0}
.mm-top{display:flex;justify-content:space-between;gap:8px}
.mm-top b{font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mm-top span{color:var(--ios-sec);font-size:15px;white-space:nowrap}
.mm-s{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mm-p{font-size:15px;color:var(--ios-sec);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3}
.mail-doc{padding:6px 18px 40px}
.mail-doc h2{font-size:24px;margin:0 0 14px;line-height:1.25}
.mfrom{display:flex;gap:10px;align-items:center;padding-bottom:12px;border-bottom:.5px solid var(--ios-sep);margin-bottom:16px;font-size:14px}
.mfrom b{font-size:16px}
.mfrom small{display:block;color:var(--ios-sec);font-size:13px}
.mail-doc p{white-space:pre-wrap;font-size:16px;line-height:1.55;margin:0}

/* diary */
.diaryapp{background:#f6f1e7}
.diaryapp .nb{color:#8a5a2b}
.diaryapp .nb.ed{background:rgba(138,90,43,.12)!important}
.dcard{display:flex!important;gap:14px;width:calc(100% - 32px);margin:0 16px 10px;padding:14px!important;background:#fffdf8!important;border-radius:14px;text-align:left!important;box-shadow:0 1px 3px rgba(80,50,20,.08)}
.dcard-d{flex:none;width:52px;text-align:center;color:#8a5a2b;font-size:12px;line-height:1.2;border-right:1px solid #eadfcb;padding-right:12px}
.dcard-d b{display:block;font-size:15px}
.dcard-m{flex:1;min-width:0}
.dcard-m b{display:block;font-size:16px;color:#2b2016}
.dcard-m span{font-size:14px;color:#7d6c5b;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.paper{margin:4px 14px 40px;background:#fffdf8;border-radius:14px;padding:18px 18px 30px;box-shadow:0 1px 3px rgba(80,50,20,.08);color:#2b2016}
.paper-meta{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:#8a5a2b;margin-bottom:10px}
.paper-meta span{background:#f3eadb;border-radius:8px;padding:2px 8px}
.paper h2{font-size:22px;margin:0 0 10px}
.paper p,.paper .inplace.b{white-space:pre-wrap;font-size:16px;line-height:32px;margin:0;background-image:repeating-linear-gradient(transparent 0 31px,#eadfcb 31px 32px)}
.dlock{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;color:#5a4330}
.dlock input{width:180px;height:44px;text-align:center;font-size:22px;letter-spacing:.3em;border:1px solid #d9c8ad;border-radius:12px;background:#fff;outline:none}

/* settings */
.wallpair{display:flex;gap:14px;justify-content:center;padding:16px}
.wallpair button{width:96px;aspect-ratio:9/19;border-radius:14px;border:3px solid #1c1c1e!important;overflow:hidden;color:#fff;font-size:20px;font-weight:700;display:flex!important;align-items:flex-start;justify-content:center;padding-top:24px!important;text-shadow:0 1px 4px rgba(0,0,0,.3)}
.prow{display:flex!important;align-items:center;gap:14px;padding:12px 16px!important;width:100%;text-align:left!important}
.prow b{display:block;font-size:20px;font-weight:500}
.prow span{font-size:14px;color:var(--ios-sec)}

/* custom app */
.cpage{padding:6px 20px 40px}
.cpage img{width:100%;border-radius:14px;margin-bottom:14px;display:block}
.cpage p{white-space:pre-wrap;font-size:17px;line-height:1.5;margin:0}

/* iOS polish */
.view.anim-push{animation:vpush .34s cubic-bezier(.2,.8,.2,1)}
.view.anim-pop{animation:vpop .3s cubic-bezier(.2,.8,.2,1)}
.view.anim-open{animation:vopen .36s cubic-bezier(.2,.85,.25,1)}
.view.anim-close{animation:vclose .32s cubic-bezier(.2,.85,.25,1)}
.view.anim-unlock{animation:vunlock .38s cubic-bezier(.2,.85,.25,1)}
@keyframes vpush{from{transform:translateX(38%);opacity:.5}to{transform:none;opacity:1}}
@keyframes vpop{from{transform:translateX(-26%);opacity:.6}to{transform:none;opacity:1}}
@keyframes vopen{from{transform:scale(.18);opacity:0;border-radius:60px}to{transform:none;opacity:1}}
@keyframes vclose{from{transform:scale(1.12);opacity:.3}to{transform:none;opacity:1}}
@keyframes vunlock{from{transform:scale(1.14);opacity:0}to{transform:none;opacity:1}}
.view{overflow:hidden}
.lock-ic{display:flex;justify-content:center;margin-bottom:6px;opacity:.95}
.hsearch{align-self:center;display:flex;align-items:center;gap:5px;padding:6px 13px;border-radius:16px;background:rgba(255,255,255,.26);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#fff;font-size:13px;font-weight:600;margin:0 0 12px}
.home.ink .hsearch{color:#111;background:rgba(255,255,255,.55)}
.hsearch svg{width:13px;height:13px}
.app .nav{position:relative;z-index:3;transition:background .2s,box-shadow .2s}
.app.has-lt .nav .nt{opacity:0;transition:opacity .18s}
.app.has-lt.scrolled .nav .nt{opacity:1}
.app.scrolled .nav{background:rgba(249,249,249,.88);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);box-shadow:0 .5px 0 rgba(0,0,0,.18)}
.app.grp.scrolled .nav,.notesapp.scrolled .nav{background:rgba(242,242,247,.88)}
.app.scrolled{padding-top:0}
.app.scrolled .nav{padding-top:54px;height:98px}
.app{transition:none}
.bub.tail::before,.bub.tail::after{content:"";position:absolute;bottom:0;height:20px;pointer-events:none}
.me .bub.tail::before{right:-7px;width:20px;background:var(--ios-blue);border-bottom-left-radius:16px 14px}
.me .bub.tail::after{right:-26px;width:26px;background:#fff;border-bottom-left-radius:10px}
.them .bub.tail::before{left:-7px;width:20px;background:var(--ios-bub);border-bottom-right-radius:16px 14px}
.them .bub.tail::after{left:-26px;width:26px;background:#fff;border-bottom-right-radius:10px}
.bub.tail.ed-on{outline:none}
.btool{flex:none;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:8px 14px 34px;font-size:12px;color:#3c3c43;text-align:center;background:rgba(249,249,249,.94);border-top:.5px solid var(--ios-sep)}
.grp .btool,.notesapp .btool{background:rgba(242,242,247,.94)}
.btool>:last-child{justify-self:end;color:var(--ios-blue);display:grid;place-items:center}
.notesapp .btool>:last-child{color:#d9a400}
/* photos */
.photosapp .nb.ed{background:rgba(0,122,255,.12)!important}
.scroll.tabbed{padding-bottom:100px}
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;justify-content:space-around;padding:7px 30px 30px;background:rgba(249,249,249,.92);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border-top:.5px solid rgba(0,0,0,.18)}
.tabbar button{display:flex!important;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:500;color:#999;min-width:70px}
.tabbar button.on{color:var(--ios-blue)}
.pgrid{gap:1.5px}
.pt-ph{position:absolute;inset:0;opacity:.75}
.albums{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px;padding:0 16px 20px}
.alb{display:flex!important;flex-direction:column;align-items:flex-start;gap:3px;text-align:left!important;min-width:0}
.alb-c{width:100%;aspect-ratio:1;border-radius:9px;overflow:hidden;background:#e4e4e8;display:block;margin-bottom:5px}
.alb-c img{width:100%;height:100%;object-fit:cover;display:block}
.alb b{font-size:15px;font-weight:400;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alb span{font-size:15px;color:var(--ios-sec)}
.alb-h{font-size:22px;font-weight:700;padding:4px 16px 12px}
.pviewer{background:#fff;padding-top:54px;transition:background .25s}
.pviewer.dark{background:#000}
.pviewer .nav{background:rgba(249,249,249,.94);border-bottom:.5px solid var(--ios-sep);transition:opacity .2s}
.pviewer.dark .nav,.pviewer.dark .pv-tools,.pviewer.dark .pv-strip,.pviewer.dark .pv-info{opacity:0;pointer-events:none}
.pv-t{display:flex;flex-direction:column;align-items:center;line-height:1.2;max-width:220px;text-align:center}
.pv-t b{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.pv-t small{font-size:12px;color:var(--ios-sec);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.pv{flex:1;display:grid;place-items:center;min-height:0;overflow:hidden;touch-action:pan-y;user-select:none}
.pv img{max-width:100%;max-height:100%;object-fit:contain;-webkit-user-drag:none}
.pv-ph{width:100%;aspect-ratio:4/3}
.pv.slide-next img,.pv.slide-next .pv-ph{animation:pnext .25s ease-out}
.pv.slide-prev img,.pv.slide-prev .pv-ph{animation:pprev .25s ease-out}
@keyframes pnext{from{transform:translateX(40%);opacity:.3}to{transform:none;opacity:1}}
@keyframes pprev{from{transform:translateX(-40%);opacity:.3}to{transform:none;opacity:1}}
.pv-strip{flex:none;display:flex;gap:2px;justify-content:center;padding:8px 10px 2px;overflow-x:auto;background:#fff;scrollbar-width:none}
.pv-strip button{width:28px;height:40px;flex:none;overflow:hidden;opacity:.7;display:block!important}
.pv-strip button.on{width:40px;opacity:1;margin:0 4px}
.pv-strip img,.pv-strip span{width:100%;height:100%;object-fit:cover;display:block}
.pv-tools{flex:none;display:flex;justify-content:space-between;align-items:center;padding:10px 26px 38px;color:var(--ios-blue);background:#fff}
.pv-tools button{color:var(--ios-blue)}
.pv-tools button.on{opacity:.6}
.pv-tools span{opacity:.9}
.pv-info{position:absolute;left:12px;right:12px;bottom:150px;z-index:5;background:rgba(255,255,255,.96);border-radius:14px;padding:12px 14px;box-shadow:0 8px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:2px;font-size:14px}
.pv-info b{font-size:16px}
.pv-info span{color:var(--ios-sec)}

/* phone app */
.phoneapp .nb.ed{background:rgba(0,122,255,.12)!important}
.rc{display:flex!important;align-items:center;gap:12px;width:100%;padding:6px 16px!important;text-align:left!important}
.rc-m{flex:1;min-width:0;border-bottom:.5px solid var(--ios-sep);padding:6px 0 10px}
.rc-m b{display:block;font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-m span{font-size:14px;color:var(--ios-sec);display:flex;align-items:center;gap:3px}
.rc.miss .rc-m b{color:var(--ios-red)}
.rc em{font-style:normal;font-size:15px;color:var(--ios-sec);white-space:nowrap}
.ct-me{display:flex!important;align-items:center;gap:12px;width:100%;padding:8px 16px 14px!important;text-align:left!important;border-bottom:.5px solid var(--ios-sep);margin-bottom:6px}
.ct-me b{display:block;font-size:20px;font-weight:600}
.ct-me span{font-size:13px;color:var(--ios-sec)}
.ct{display:block!important;width:100%;text-align:left!important;padding:11px 16px!important;font-size:17px;position:relative}
.ct+.ct::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--ios-sep)}
.ct-hero{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0 16px}
.ct-hero b{font-size:28px;font-weight:600}
.ct-acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 16px 20px}
.ct-acts>*{display:flex!important;flex-direction:column;align-items:center;gap:4px;background:#fff!important;border-radius:12px;padding:10px 0!important;font-size:12px;color:var(--ios-blue)}
.ct-acts span{opacity:.45}
.ct-acts i{height:24px;display:grid;place-items:center}

 saving=true;
 try{ await DB.doc('phones/'+PID).set(body); lastSaved=js; dirty=false; setSaveState('저장됨'); }
 catch(e){
  dirty=false; setSaveState('저장 실패');
  if(e&&e.code==='invalid_argument'){canWrite=false;editMode=false;toast('이 휴대폰을 수정할 권한이 없어요. 보기 모드로 바꿨어요.');renderRail();renderScreen();}

let pickCb=null;
function pick(cb,multiple){pickCb=cb;const f=$('#filepick');f.multiple=!!multiple;f.click();}
$('#filepick').addEventListener('change',async e=>{const files=[...e.target.files];e.target.value='';if(files.length&&pickCb)pickCb(files);});
function shrink(file,max,q){return new Promise(res=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>res(b),'image/jpeg',q);};img.onerror=()=>{URL.revokeObjectURL(u);res(null);};img.src=u;});}
const blobToData=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b);});
async function uploadImage(file){
 if(ASSETS&&!isLocal(PID)){
  let blob=file;
  if(file.type!=='image/gif'&&file.size>3.5e6){const s=await shrink(file,2200,.88);if(s)blob=s;}
  try{const r=await ASSETS.upload(blob,blob.type?undefined:{type:'image/jpeg'});return 'a:'+r.id;}
  catch(e){
   if(e&&e.code==='too_large')toast('사진이 너무 커요. 20MB보다 작은 사진을 골라 주세요.');
   else if(e&&e.code==='unsupported_type')toast('이 형식의 사진은 올릴 수 없어요. JPG나 PNG로 골라 주세요.');
   else if(e&&e.code==='quota_or_state')toast('사진 저장 공간이 가득 찼어요.');
   else toast('사진을 올리지 못했어요. 다시 시도해 주세요.');
   return null;
  }
 }
 if(!editable()) return null;
 let b=await shrink(file,720,.78); if(!b){toast('사진을 읽지 못했어요.');return null;}
 if(b.size>70000) b=await shrink(file,520,.7);
 return await blobToData(b);
}

function saveBlob(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000); }
const safeName=n=>String(n||'phone').replace(/[\\/:*?"<>|]/g,'_').trim()||'phone';
function b64u(bytes){let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function unb64u(str){const bin=atob(str.replace(/-/g,'+').replace(/_/g,'/'));const out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out;}
async function packPhone(d){
 const bytes=new TextEncoder().encode(JSON.stringify(d));
 if(window.CompressionStream){ try{ const st=new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate')); return 'v1.'+b64u(new Uint8Array(await new Response(st).arrayBuffer())); }catch(e){} }
 return 'v0.'+b64u(bytes);
}
async function unpackPhone(h){
 let bytes=unb64u(h.slice(3));
 if(h.startsWith('v1.')){ const st=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate')); bytes=new Uint8Array(await new Response(st).arrayBuffer()); }
 return JSON.parse(new TextDecoder().decode(bytes));
}
function stripLocalImages(o){ let n=0; const walk=x=>{ if(Array.isArray(x)) x.forEach((v,i)=>{ if(typeof v==='string'&&v.startsWith('data:')){x[i]='';n++;} else if(v&&typeof v==='object') walk(v); }); else for(const k in x){ const v=x[k]; if(typeof v==='string'&&v.startsWith('data:')){x[k]='';n++;} else if(v&&typeof v==='object') walk(v); } }; walk(o); return n; }
function compactPhone(o){
 delete o.createdAt; delete o.updatedAt; delete o.shareSlug;
 (o.home&&o.home.apps||[]).forEach(a=>{ if(APPDEF[a.type]&&a.bg===APPDEF[a.type].bg) delete a.bg; });
 const walkArr=arr=>arr.forEach(it=>{ if(it&&typeof it==='object'&&!Array.isArray(it)){ for(const k in it){ const v=it[k]; if(v===''||v===false) delete it[k]; else if(Array.isArray(v)) walkArr(v); } } });
 const walk=x=>{ for(const k in x){ const v=x[k]; if(Array.isArray(v)) walkArr(v); else if(v&&typeof v==='object') walk(v); } };
 walk(o); return o;
}
const slugOk=v=>/^[a-z0-9][a-z0-9_-]{0,39}$/.test(v||'');
function suggestSlug(d){ const a=String(d.name||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); return slugOk(a)?a:'phone'+Math.floor(Math.random()*900+100); }

let SHEETS=[];
function pushSheet(s){ if(SHEETS.length) { const top=SHEETS[SHEETS.length-1]; if(top.collect) top.st=top.collect(); } SHEETS.push(s); drawSheet(); }
function popSheet(n=1){ SHEETS.splice(-n,n); drawSheet(); }
function closeSheets(){ SHEETS=[]; drawSheet(); }
function drawSheet(){
 const el=$('#sheet');
 if(!SHEETS.length){el.hidden=true;el.innerHTML='';applyPending();return;}
 const s=SHEETS[SHEETS.length-1];
 el.hidden=false;
 el.innerHTML=`<div class="sh-back" data-a="shCancel"></div><div class="sh" role="dialog" aria-modal="true" aria-label="${esc(s.title)}">
  <div class="sh-head"><button class="btn ghost sm" data-a="shCancel">${SHEETS.length>1?'‹ 뒤로':'닫기'}</button><h2>${esc(s.title)}</h2>${s.save?'<button class="btn primary sm" data-a="shSave">저장</button>':'<span></span>'}</div>
  <div class="sh-body">${s.html()}</div></div>`;
 const first=el.querySelector('.sh-body input:not([type=hidden]),.sh-body textarea');
 if(first&&s.autofocus) first.focus();
}
function fieldHtml(f,v){
 const id='f_'+f.k, lab=`<label for="${id}">${esc(f.l)}</label>`, help=f.h?`<small>${esc(f.h)}</small>`:'';
 if(f.t==='textarea') return `<div class="fld">${lab}<textarea id="${id}" rows="${f.rows||4}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>${help}</div>`;
 if(f.t==='select') return `<div class="fld">${lab}<select id="${id}">${f.o.map(([ov,ol])=>`<option value="${esc(ov)}" ${String(ov)===String(v)?'selected':''}>${esc(ol)}</option>`).join('')}</select>${help}</div>`;
 if(f.t==='toggle') return `<div class="fld tog"><label for="${id}">${esc(f.l)}</label><input type="checkbox" id="${id}" ${v?'checked':''}></div>${help?`<div class="fld">${help}</div>`:''}`;
 if(f.t==='date') return `<div class="fld">${lab}<input type="date" id="${id}" value="${esc(v)}">${help}</div>`;
 if(f.t==='number') return `<div class="fld">${lab}<input type="number" id="${id}" value="${esc(v)}" ${f.min!=null?`min="${f.min}"`:''} ${f.max!=null?`max="${f.max}"`:''} step="${f.step||1}">${help}</div>`;
 if(f.t==='image'||f.t==='wall'||f.t==='bg'){
  return `<div class="fld"><label>${esc(f.l)}</label><input type="hidden" id="${id}" value="${esc(v||'')}">
   <div class="imgf"><div class="imgprev ${f.t==='wall'?'wall':''}" id="pv_${f.k}" data-t="${f.t}" style="background:${esc(prevCss(f.t,v))}"></div>

   ${f.t!=='image'?`<div class="swatches">${GRADS.map((g,i)=>`<button type="button" class="sw" data-a="setSw" data-k="${f.k}" data-v="g:${i}" style="background:${g}" aria-label="배경 ${i+1}"></button>`).join('')}${f.t==='bg'?`<input type="color" class="cpick" data-k="${f.k}" aria-label="색 직접 고르기">`:''}</div>`:''}${help}</div>`;
 }
 return `<div class="fld">${lab}<input type="text" id="${id}" value="${esc(v)}" placeholder="${esc(f.ph||'')}" ${f.num?'inputmode="numeric"':''} ${f.max?`maxlength="${f.max}"`:''}>${help}</div>`;
}
function prevCss(t,v){ if(t==='image') return v?`center/cover no-repeat url("${src(v)}")`:'var(--sunk)'; return bgCss(v,'var(--sunk)'); }

function openForm({title,fields,values={},onSave,onDelete,extra=[],note,deleteLabel='삭제',autofocus}){

  doSave(){const v=this.collect();if(onSave(v)!==false){popSheet();commit();}},
  extra,onDelete,deleteLabel};

/* diary */
S.diary=()=>{const D=P.diary;
 if(D.lock&&!editMode&&!T.diaryOpen) return `<div class="app diaryapp">${navbar(appLabel('diary'),{large:true})}<form class="dlock" data-form="diaryPin"><div style="font-size:40px">🔒</div><b>잠긴 일기장</b><input id="diarypin" type="password" inputmode="numeric" autocomplete="off" aria-label="일기장 비밀번호" class="${T.shake?'shake':''}"><button class="nb ed" style="color:#8a5a2b">열기</button></form></div>`;
 return `<div class="app diaryapp">${navbar(appLabel('diary'),{large:true,right:ed('+ 일기','addEntry')+ed('잠금','diaryLock')})}<div class="scroll">
 ${D.items.map(e=>{const m=/(\d+)\s*년\s*(\d+)\s*월\s*(\d+)/.exec(e.date)||/(\d{4})[.\-/](\d{1,2})[.\-/](\d{1,2})/.exec(e.date);return `<button class="dcard" data-a="go" data-s="entry" data-id="${e.id}"><div class="dcard-d">${m?`<b>${+m[3]}</b>${+m[2]}월`:`<b>·</b>${esc(e.date)}`}</div><div class="dcard-m"><b>${esc(e.title||'제목 없음')}</b><span>${esc(e.body)}</span></div></button>`;}).join('')||'<div class="empty-in"><b>아직 쓴 일기가 없어요</b></div>'}</div></div>`;};
S.entry=r=>{const e=P.diary.items.find(x=>x.id===r.id);if(!e){route.pop();return S.diary();}
 return `<div class="app diaryapp">${navbar('',{back:appLabel('diary'),right:ed('날짜·날씨','editEntry',e.id)})}<div class="scroll"><div class="paper">
 <div class="paper-meta"><span>${esc(e.date)}</span>${e.weather?`<span>${esc(e.weather)}</span>`:''}${e.mood?`<span>${esc(e.mood)}</span>`:''}</div>
 ${editMode?`<input class="inplace h" data-bind="entry|${e.id}|title" value="${esc(e.title)}" placeholder="제목" aria-label="제목" style="font-size:22px"><textarea class="inplace b" data-bind="entry|${e.id}|body" placeholder="오늘 있었던 일" aria-label="내용">${esc(e.body)}</textarea>`:`<h2>${esc(e.title)}</h2><p>${esc(e.body)}</p>`}</div></div></div>`;};

/* phone app */
const digits=s=>String(s||'').replace(/\D/g,'');
function allRecents(){ return editMode?P.phone.recents:T.recents.concat(P.phone.recents); }
const KIND={in:'수신',out:'발신',missed:'부재중'};
function phoneTabs(){const t=T.phoneTab||'recents';const b=(v,label,ic)=>`<button class="${t===v?'on':''}" data-a="phoneTab" data-v="${v}">${ic}<span>${label}</span></button>`;
 return `<div class="tabbar">${b('recents','최근 기록',SV.clock.replace('width="18" height="18"','width="26" height="26"'))}${b('contacts','연락처',SV.kFriends)}${b('keypad','키패드','<svg width="26" height="24" viewBox="0 0 26 24">'+[0,1,2].flatMap(r=>[0,1,2].map(c=>`<circle cx="${6+c*7}" cy="${4+r*7}" r="2.3" fill="currentColor"/>`)).join('')+'</svg>')}</div>`;}
S.phone=()=>{const tab=T.phoneTab||'recents';let body='';
 if(tab==='recents'){const rs=allRecents();
  body=`${navbar('최근 기록',{large:true,right:ed('기록 관리','editRecents')})}<div class="scroll tabbed">
  ${rs.map(r=>{const c=contactFor(r.name);return `<button class="rc ${r.kind==='missed'?'miss':''}" data-a="callName" data-v="${esc(r.name)}">${avatar(r.name,c&&c.avatar,40)}<div class="rc-m"><b>${esc(r.name)}</b><span>${r.kind==='out'?SV.phone.replace('width="34" height="34"','width="11" height="11"')+' ':''}${KIND[r.kind]||''}${r.dur?' · '+esc(r.dur):''}</span></div><em>${esc(r.when||'')}</em></button>`;}).join('')||'<div class="empty-in"><b>최근 기록 없음</b></div>'}</div>`;}
 else if(tab==='contacts'){const cs=[...P.phone.contacts].sort((a,b)=>String(a.name).localeCompare(String(b.name),'ko'));
  body=`${navbar('연락처',{large:true,right:ed('+ 연락처','addContact')})}<div class="scroll tabbed">
  <div class="sbar">${SV.search}검색</div>
  <button class="ct-me">${avatar(P.owner,P.sns.avatar,56)}<div><b>${esc(P.owner)}</b><span>내 카드</span></div></button>
  ${cs.map(c=>`<button class="ct" data-a="go" data-s="contact" data-id="${c.id}">${esc(c.name)}</button>`).join('')||'<div class="empty-in"><b>연락처 없음</b></div>'}</div>`;}
 else { const d=T.dial||''; const match=(P.phone.contacts||[]).find(c=>digits(c.number)&&digits(c.number)===digits(d));
  body=`<div class="kp"><div class="kp-num">${esc(d)}</div><div class="kp-name">${match?esc(match.name):'&nbsp;'}</div>
  <div class="keys kp-keys">${[1,2,3,4,5,6,7,8,9,'*',0,'#'].map(k=>`<button class="key" data-a="dial" data-v="${k}"><b>${k}</b><small>${KEYL[k]||(k===0?'+':'&nbsp;')}</small></button>`).join('')}</div>
  <div class="kp-bot"><span></span><button class="cbtn green" data-a="dialCall" aria-label="전화 걸기">${SV.phone}</button>${d?'<button class="kp-del" data-a="dialDel" aria-label="지우기">⌫</button>':'<span></span>'}</div></div>`; }
 return `<div class="app phoneapp">${body}${phoneTabs()}</div>`;};
S.contact=r=>{const c=P.phone.contacts.find(x=>x.id===r.id);if(!c){route.pop();return S.phone();}
 return `<div class="app grp phoneapp">${navbar('',{back:'연락처',right:ed('편집','editContact',c.id)})}<div class="scroll">
 <div class="ct-hero">${avatar(c.name,c.avatar,96)}<b>${esc(c.name)}</b></div>
 <div class="ct-acts"><span><i>${SV.kChats}</i>메시지</span><button data-a="callContact" data-id="${c.id}"><i>${SV.phone.replace('width="34" height="34"','width="22" height="22"')}</i>통화</button><span><i>${SV.compose}</i>메일</span></div>
 <div class="grpl"><button class="gr ct-num" data-a="callContact" data-id="${c.id}"><small>휴대전화</small>${esc(c.number||'번호 없음')}</button></div>
 ${editMode?`<p class="edhint">이 사람에게 전화를 걸면 ${c.answer?'받아요. 받은 뒤 아래 대사가 자막처럼 나와요.':'받지 않아요.'}${c.answer&&c.lines?`\n\n${esc(c.lines)}`:''}</p>`:''}</div></div>`;};

/* kakaotalk-style messenger */
function kav(name,img,size){return `<span class="kav" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.4)}px;${img?'':`background:${GRADS[hashIdx(name)%GRADS.length]}`}">${img?`<img src="${esc(src(img))}" alt="">`:esc((name||'?').trim().charAt(0))}</span>`;}
S.talk=()=>{const tab=T.talkTab||'chats', me=P.talk.me, ts=P.talk.threads;
 const head=(title,right)=>`<div class="k-head"><b>${title}</b><div class="nr">${right}</div></div>`;
 let body;
 if(tab==='friends') body=`${head('친구',ed('내 프로필','editKMe'))}<div class="scroll k-scroll">
  <button class="k-me" data-a="go" data-s="kprofile" data-id="me">${kav(me.name,me.avatar,60)}<div><b>${esc(me.name)}</b>${me.status?`<span>${esc(me.status)}</span>`:''}</div></button>
  <div class="k-sec">친구 ${ts.length}</div>
  ${ts.map(t=>`<button class="k-fr" data-a="go" data-s="kprofile" data-id="${t.id}">${kav(t.name,t.avatar,44)}<div><b>${esc(t.name)}</b>${t.status?`<span>${esc(t.status)}</span>`:''}</div></button>`).join('')}</div>`;
 else body=`${head('채팅',ed('+ 채팅','addKThread'))}<div class="scroll k-scroll">
  ${ts.map(t=>{const l=lastMsg(t);return `<button class="k-row" data-a="go" data-s="kthread" data-id="${t.id}">${kav(t.name,t.avatar,48)}<div class="k-mid"><b>${esc(t.name)}</b><span>${esc(l?(l.text||(l.img?'사진을 보냈습니다.':'')):'')}</span></div><em>${esc(l?.time||'')}</em></button>`;}).join('')||`<div class="empty-in"><b>채팅 없음</b>${editMode?'오른쪽 위 + 채팅으로 새 채팅을 만드세요.':''}</div>`}</div>`;
 return `<div class="app talkapp">${body}<div class="tabbar k-tabs"><button class="${tab==='friends'?'on':''}" data-a="talkTab" data-v="friends">${SV.kFriends}<span>친구</span></button><button class="${tab==='chats'?'on':''}" data-a="talkTab" data-v="chats">${SV.kChats}<span>채팅</span></button></div></div>`;};
S.kprofile=r=>{const isMe=r.id==='me', t=isMe?null:thread(r.id), o=isMe?P.talk.me:t; if(!o){route.pop();return S.talk();}
 const ph=SV.phone.replace('width="34" height="34"','width="26" height="26"');
 return `<div class="kprof" style="background:${esc(o.bg?bgCss(o.bg):GRADS[hashIdx(o.name)%GRADS.length])}"><div class="kprof-dim"></div><div class="kprof-in">
 <div class="kprof-top"><button class="nb" data-a="back" aria-label="닫기">✕</button>${editMode?`<button class="nb ed" data-a="${isMe?'editKMe':'editThread'}" data-id="${isMe?'':t.id}">편집</button>`:''}</div>
 <div class="kprof-mid">${kav(o.name,o.avatar,100)}<b>${esc(o.name)}</b>${o.status?`<span>${esc(o.status)}</span>`:''}</div>
 <div class="kprof-acts">${isMe?`<div><i>${SV.kChats}</i><small>나와의 채팅</small></div><div><i>${SV.compose}</i><small>프로필 편집</small></div>`:`<button data-a="kOpenChat" data-id="${t.id}"><i>${SV.kChats}</i><small>1:1 채팅</small></button><div><i>${ph}</i><small>통화하기</small></div>`}</div></div></div>`;};
function kChatLog(t){
 const arr=allMsgs(t), tempStart=t.msgs.length; let h='';
 arr.forEach((m,i)=>{
  const saved=i<tempStart;
  if(m.date){h+=`<button class="kdate" ${editMode&&saved?`data-a="editMsg" data-t="${t.id}" data-id="${m.id}"`:''}>${esc(m.text)}</button>`;return;}
  const pv=arr[i-1], nx=arr[i+1];
  const first=!pv||pv.date||pv.me!==m.me, last=!nx||nx.date||nx.me!==m.me||(nx.time||'')!==(m.time||'');
  const unread=m.me&&!saved&&!T.readSet.has(m.id);
  const bub=`<button class="kb ${m.img&&!m.text?'pic':''} ${first?'first':''} ${editMode?'ed-on':''}" ${editMode&&saved?`data-a="editMsg" data-t="${t.id}" data-id="${m.id}"`:''}>${m.img?`<img src="${esc(src(m.img))}" alt="">`:''}${m.text?`<span>${esc(m.text)}</span>`:''}</button>`;
  const meta=`<span class="kmeta">${unread?'<i>1</i>':''}${last&&m.time?`<small>${esc(m.time)}</small>`:''}</span>`;
  if(m.me) h+=`<div class="krow me">${meta}${bub}</div>`;
  else h+=`<div class="krow them ${first?'first':''}">${first?kav(t.name,t.avatar,38):'<span class="kav-sp"></span>'}<div class="kcol">${first?`<span class="kname">${esc(t.name)}</span>`:''}<div class="kline">${bub}${meta}</div></div></div>`;
 });
 if(!editMode&&T.typing===t.id) h+=`<div class="krow them first">${kav(t.name,t.avatar,38)}<div class="kcol"><span class="kname">${esc(t.name)}</span><div class="typing"><i></i><i></i><i></i></div></div></div>`;
 if(!editMode&&(T.chats[t.id]||[]).length) h+=`<div class="tempnote">이 대화는 저장되지 않아요 <button data-a="clearTemp" data-id="${t.id}">지우기</button></div>`;
 if(editMode&&!t.msgs.length) h+='<div class="empty-in">아래 입력창에서 나 또는 상대를 고르고 메시지를 추가하세요.</div>';
 return h;
}
S.kthread=r=>{const t=thread(r.id);if(!t){route.pop();return S.talk();}
 return `<div class="app kchat"><div class="k-chead"><div><button class="nb" data-a="back" aria-label="뒤로">${SV.chev}</button></div><b ${editMode?`data-a="editThread" data-id="${t.id}"`:''}>${esc(t.name)}${editMode?' ✎':''}</b><div class="nr">${editMode?`<button class="nb ed" data-a="rules" data-id="${t.id}">자동 답장</button>`:`<span class="k-ic" aria-hidden="true">${SV.search}</span>`}</div></div>
 <div class="scroll chatlog kchatlog" id="chatlog">${kChatLog(t)}</div>
 <form class="composer kcomposer" data-form="send" data-id="${t.id}">${editMode?`<button type="button" class="plus" data-a="chatPlus" data-id="${t.id}" aria-label="사진이나 날짜 추가">+</button><div class="who"><button type="button" data-a="sendAs" data-v="me" class="${T.sendAs==='me'?'on':''}">나</button><button type="button" data-a="sendAs" data-v="them" class="${T.sendAs==='them'?'on':''}">상대</button></div>`:'<span class="kplus" aria-hidden="true">+</span>'}
 <input id="chatin" autocomplete="off" aria-label="메시지" placeholder="${editMode?(T.sendAs==='me'?'내가 보낸 메시지':'상대가 보낸 메시지'):'메시지 입력'}"><button class="ksend" aria-label="보내기">${SV.up}</button></form></div>`;};

/* calendar */
const pad2=n=>String(n).padStart(2,'0');
const isoOf=(y,m,d)=>`${y}-${pad2(m)}-${pad2(d)}`;
const DOW=['일','월','화','수','목','금','토'];
function calToday(){ const m=/(\d{1,2})\s*월\s*(\d{1,2})\s*일/.exec(P.lock.date||''); const y=Math.round(+P.lock.year)||2026; return m?isoOf(y,+m[1],+m[2]):isoOf(y,1,1); }
function parseIso(s){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); return m?{y:+m[1],m:+m[2],d:+m[3]}:null; }
function dayLabel(iso){ const p=parseIso(iso); if(!p) return iso||''; const w=new Date(p.y,p.m-1,p.d).getDay(); return `${p.m}월 ${p.d}일 ${DOW[w]}요일`; }
function calGlyph(){ const p=P?parseIso(calToday()):null; const d=p?p.d:18; return `<svg viewBox="0 0 60 60"><rect x="0" y="0" width="60" height="19" fill="#ff3b30"/><circle cx="19" cy="9.5" r="2.6" fill="#fff"/><circle cx="41" cy="9.5" r="2.6" fill="#fff"/><text x="30" y="46" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-size="27" font-weight="600" fill="#1c1c1e">${d}</text></svg>`; }
const evSort=(a,b)=>String(a.date).localeCompare(String(b.date))||String(a.time||'').localeCompare(String(b.time||''));
S.calendar=()=>{
 const today=calToday(), tp=parseIso(today);
 if(!T.calY){T.calY=tp.y;T.calM=tp.m;}
 const y=T.calY, m=T.calM, sel=T.calSel||today;
 const first=new Date(y,m-1,1).getDay(), days=new Date(y,m,0).getDate();
 const evs=P.calendar.events; const has=new Set(evs.map(e=>e.date));
 let cells=''; for(let i=0;i<first;i++) cells+='<span></span>';
 for(let d=1;d<=days;d++){ const iso=isoOf(y,m,d), w=(first+d-1)%7; cells+=`<button class="cd ${iso===today?'today':''} ${iso===sel?'sel':''} ${w===0||w===6?'we':''}" data-a="calSel" data-v="${iso}"><span>${d}</span>${has.has(iso)?'<i></i>':''}</button>`; }
 const list=evs.filter(e=>e.date===sel).sort(evSort);
 return `<div class="app calapp"><div class="nav"><div><span class="cal-y">${y}년</span></div><div class="nt"></div><div class="nr">${ed('+ 일정','addEvent')}</div></div>
 <div class="cal-top"><h1 class="cal-m">${m}월</h1><div class="cal-arrows"><button data-a="calMove" data-v="-1" aria-label="이전 달">${SV.chev}</button><button data-a="calMove" data-v="1" aria-label="다음 달" style="transform:scaleX(-1)">${SV.chev}</button></div></div>
 <div class="cal-dow">${DOW.map((d,i)=>`<span class="${i===0||i===6?'we':''}">${d}</span>`).join('')}</div>
 <div class="cal-grid">${cells}</div>
 <div class="scroll cal-list"><div class="cal-day">${esc(dayLabel(sel))}${sel===today?' · 오늘':''}</div>
 ${list.map(e=>`<button class="ev" data-a="go" data-s="event" data-id="${e.id}"><i style="background:${esc(e.color||'#007aff')}"></i><div><b>${esc(e.title||'새로운 이벤트')}</b>${e.place?`<span>${esc(e.place)}</span>`:''}</div><em>${esc(e.time||'')}</em></button>`).join('')||'<p class="ev-none">일정 없음</p>'}
 ${editMode?`<p class="edhint" style="margin-top:12px">날짜를 누른 뒤 오른쪽 위 ‘+ 일정’을 누르면 그날에 일정이 생겨요.</p>`:''}</div>
 <div class="btool"><button data-a="calToday" style="color:#ff3b30;justify-self:start">오늘</button><span></span><span></span></div></div>`;
};
S.event=r=>{const e=P.calendar.events.find(x=>x.id===r.id);if(!e){route.pop();return S.calendar();}const p=parseIso(e.date);
 return `<div class="app grp calapp">${navbar('',{back:p?`${p.m}월`:'캘린더',right:ed('편집','editEvent',e.id)})}<div class="scroll"><div class="ev-doc">
 <h2>${esc(e.title||'새로운 이벤트')}</h2>${e.place?`<p class="ev-place">${esc(e.place)}</p>`:''}
 <p class="ev-when">${p?`${p.y}년 ${esc(dayLabel(e.date))}`:esc(e.date)}<br>${esc(e.time||'')}</p></div>
 <div class="grpl"><div class="gr"><span class="ev-dot" style="background:${esc(e.color||'#007aff')}"></span>캘린더<span class="gv">${esc(P.owner)}</span></div></div>
 ${e.note?`<div class="grpl"><div class="gr ev-note"><small>메모</small>${esc(e.note)}</div></div>`:''}</div></div>`;};

/* settings */

 const row=(ic,label,val,act,g)=>`<button class="gr" ${a&&act?`data-a="${act}"`:''}><span class="gi" style="background:${ic}">${g?GI[g]:''}</span>${label}<span class="gv">${esc(val)}${a&&act?' '+SV.chevR:''}</span></button>`;
 return `<div class="app grp">${navbar(appLabel('settings'),{large:true})}<div class="scroll">
 ${a?'<p class="edhint">편집 모드에서는 여기서 잠금 화면, 홈 화면, 상태 표시줄, 휴대폰 이름을 바꿀 수 있어요.</p>':''}
 <div class="grpl"><button class="prow" ${a?'data-a="editInfo"':''}>${avatar(P.owner,P.sns.avatar,58)}<div><b>${esc(P.owner)}</b><span>${esc(P.name)}</span></div></button></div>
 <div class="gh">배경화면</div><div class="grpl"><div class="wallpair"><button style="background:${esc(bgCss(P.lock.wall))}" ${a?'data-a="editLock"':''} aria-label="잠금 화면">${esc(P.lock.time)}</button><button style="background:${esc(bgCss(P.home.wall))}" ${a?'data-a="editHome"':''} aria-label="홈 화면"></button></div></div>
 <div class="grpl">${row('#ff9500','잠금 화면',P.lock.passcode?'암호 사용':'암호 없음','editLock','lock')}${row('#5856d6','홈 화면',P.home.apps.filter(x=>!x.hidden).length+'개 앱','editHome','home')}${row('#34c759','통신사',P.status.carrier,'editInfo','ant')}${row('#34c759','배터리',P.status.battery+'%','editInfo','bat')}</div>

function matchRule(t,text){

}

 let wait=Math.max(.4,Number(r.delay)||1.5)*1000;
 setTimeout(()=>{T.readUpTo[t.id]=my.id;markRead(t.id);T.typing=t.id;if(cur().id===t.id)renderChatLog();},Math.min(900,wait/2));
 lines.forEach((line,i)=>{
  setTimeout(()=>{
   (T.chats[t.id]||(T.chats[t.id]=[])).push({id:uid(),me:false,text:line,img:'',time});

 });

let ringCtx=null, ringTimer=null, callTick=null;
function tone(f,at,d){const c=ringCtx,o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(.05,at+.02);g.gain.linearRampToValueAtTime(0,at+d);o.connect(g);g.connect(c.destination);o.start(at);o.stop(at+d+.03);}
function ringStart(){ try{ ringCtx=ringCtx||new (window.AudioContext||window.webkitAudioContext)(); if(ringCtx.resume) ringCtx.resume(); const play=()=>{const n=ringCtx.currentTime;[0,.28,.9,1.18].forEach((dt,i)=>tone(i%2?659:880,n+dt,.22));}; play(); ringTimer=setInterval(play,3000);}catch(e){} }
function ringStop(){ clearInterval(ringTimer); ringTimer=null; }
function stopCallTimers(){ ringStop(); clearInterval(callTick); callTick=null; const c=T.call; if(c){ clearTimeout(c.timeout); (c.timeouts||[]).forEach(clearTimeout); } }
function ringbackStart(){ try{ ringCtx=ringCtx||new (window.AudioContext||window.webkitAudioContext)(); if(ringCtx.resume) ringCtx.resume(); const play=()=>{const n=ringCtx.currentTime;tone(440,n,1.6);tone(480,n,1.6);}; play(); ringTimer=setInterval(play,4000);}catch(e){} }

function startOutgoing(o){

 else { c.timeout=setTimeout(()=>{ if(T.call!==c) return; ringStop(); c.noAnswer=true; renderScreen(); c.timeouts.push(setTimeout(()=>{ if(T.call===c) endCall('noanswer'); },1800)); },8000); }
}

function acceptCall(){
 const c=T.call; if(!c||c.state!=='ring') return;

}
function goLive(c){
 c.state='live'; c.t0=Date.now(); renderScreen();
 let at=1500;
 c.lines.forEach((l,i)=>{ c.timeouts.push(setTimeout(()=>{ if(T.call!==c) return; c.shown=i+1; updateCall(); },at)); at+=Math.max(1900,Math.min(4800,l.length*120)); });
 if(c.lines.length) c.timeouts.push(setTimeout(()=>{ if(T.call!==c) return; c.hung=true; updateCall(); c.timeouts.push(setTimeout(()=>{ if(T.call===c) endCall('done'); },1600)); },at+800));
 callTick=setInterval(updateCall,1000);
}
function endCall(kind){
 const c=T.call; if(!c) return;
 stopCallTimers(); T.call=null;
 const time=timeLabel(P.lock.time); const dur=c.t0?Math.round((Date.now()-c.t0)/1000):0;
 if(c.tid) (T.chats[c.tid]||(T.chats[c.tid]=[])).push({id:uid(),date:true,text:c.state==='live'?`음성 통화 ${mmss(dur)} · ${time}`:(kind==='declined'?`거절한 전화 · ${time}`:`부재중 전화 · ${time}`)});
 T.recents.unshift({id:uid(),name:c.who.name,number:c.who.number||'',kind:c.out?'out':(c.state==='live'?'in':'missed'),when:time,dur:c.state==='live'?mmss(dur):'',temp:true});

/* ---------------- music ticker ---------------- */
const AUD=new Audio(); AUD.preload='metadata';
const hasAudio=c=>!!(STANDALONE&&c&&c.audio);
function trackDur(c){ if(hasAudio(c)&&AUD.dataset.id===c.id&&isFinite(AUD.duration)&&AUD.duration>0) return AUD.duration; return durSec(c.len); }
function syncAudio(){
 const c=curTrack();
 if(T.playing&&hasAudio(c)){
  if(AUD.dataset.id!==c.id||AUD.dataset.src!==c.audio){ AUD.src=c.audio; AUD.dataset.id=c.id; AUD.dataset.src=c.audio; try{AUD.currentTime=T.pos||0;}catch(e){} }
  const pr=AUD.play(); if(pr&&pr.catch) pr.catch(err=>{ if(err&&err.name==='AbortError') return; T.playing=false; toast('음악을 재생하지 못했어요. 음악 파일 주소를 확인해 주세요.'); renderScreen(); });
 } else { AUD.pause(); }
}
function stopAudio(){ AUD.pause(); AUD.removeAttribute('src'); delete AUD.dataset.id; delete AUD.dataset.src; try{AUD.load();}catch(e){} }
AUD.addEventListener('ended',()=>{ if(T.playing) skip(1); });
AUD.addEventListener('loadedmetadata',()=>{ if(cur()&&cur().s==='player') updateProgress(); });
function updateProgress(){
 const c=curTrack(); if(!c) return; const d=trackDur(c);
 const f=$('#pfill'); if(!f) return; f.style.width=Math.min(100,T.pos/d*100)+'%'; $('#pcur').textContent=mmss(T.pos);
 const rem=f.closest('.player').querySelector('.ptimes span:last-child'); if(rem) rem.textContent='-'+mmss(Math.max(0,d-T.pos));
}
setInterval(()=>{
 if(!T.playing||!P) return; const c=curTrack(); if(!c) return;
 if(hasAudio(c)){ T.pos=AUD.currentTime||0; }
 else { T.pos+=1; if(T.pos>=durSec(c.len)){skip(1);return;} }
 updateProgress();
},500);
function setNow(id){ if(editMode){P.music.now=id;touch();} else T.now=id; T.pos=0; }
function skip(dir){const tr=P.music.tracks;if(!tr.length)return;const i=tr.findIndex(x=>x.id===curTrack().id);setNow(tr[(i+dir+tr.length)%tr.length].id);syncAudio();renderScreen();}
function fixUrl(u){ const m=/^https:\/\/github\.com\/([^/]+)\/([^/]+)\/(?:blob|raw)\/[^/]+\/(.+)$/.exec(u); return m?`https://${m[1].toLowerCase()}.github.io/${m[2]}/${m[3]}`:u; }

 webHome:()=>{route=[{s:'home'},{s:'web'}];renderScreen();},
 webQuery:el=>webSearch(el.dataset.q,true),
 /* music */
 playTrack:el=>{const id=el.dataset.id;if(curTrack()?.id!==id)setNow(id);T.playing=true;syncAudio();push({s:'player'});},
 seek:(el,e)=>{const c=curTrack();if(!c)return;const r=el.getBoundingClientRect();const f=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));T.pos=f*trackDur(c);if(hasAudio(c)&&AUD.dataset.id===c.id){try{AUD.currentTime=T.pos;}catch(_){}}updateProgress();},
 togglePlay:(el,e)=>{e.stopPropagation();T.playing=!T.playing;syncAudio();renderScreen();},
 skip:el=>skip(+el.dataset.v),
 addTrack:()=>E.track({id:'t'+uid(),title:'',artist:'',cover:'',len:'3:30'},true),
 editTrack:el=>E.track(P.music.tracks.find(x=>x.id===el.dataset.id)),
 /* sns */
 editSns:()=>E.sns(),
 addPost:()=>E.post({id:uid(),img:'',caption:'',likes:0,date:'방금',comments:''},true),
 editPost:el=>E.post(P.sns.items.find(x=>x.id===el.dataset.id)),
 like:el=>{T.liked[el.dataset.id]=!T.liked[el.dataset.id];renderScreen();},
 follow:()=>{T.follow=!T.follow;renderScreen();},
 /* mail */
 openMail:el=>{T.read[el.dataset.id]=true;push({s:'mailitem',id:el.dataset.id});},
 addMail:el=>{const box=el.dataset.id||'inbox';E.mail({id:uid(),box,from:box==='sent'?'나':'',addr:box==='sent'?P.mail.address:'',to:box==='sent'?'':'나',subject:'',body:'',date:'방금',unread:box==='inbox'},true);},
 editMail:el=>E.mail(P.mail.items.find(x=>x.id===el.dataset.id)),
 editMailAcct:()=>openForm({title:'메일 계정',values:P.mail,fields:[{k:'name',l:'이름'},{k:'address',l:'메일 주소'}],onSave(v){P.mail.name=v.name;P.mail.address=v.address;}}),
 /* diary */
 addEntry:()=>{const e={id:uid(),date:P.lock.date,weather:'',mood:'',title:'',body:''};P.diary.items.unshift(e);route.push({s:'entry',id:e.id});commit();setTimeout(()=>$('.inplace.h')?.focus(),50);},
 editEntry:el=>E.entry(P.diary.items.find(x=>x.id===el.dataset.id)),
 diaryLock:()=>openForm({title:'일기장 잠금',values:{lock:P.diary.lock},fields:[{k:'lock',l:'일기장 비밀번호',num:true,max:8,ph:'비워 두면 잠그지 않아요',h:'보기 모드에서 일기 앱을 열 때 이 번호를 입력해야 해요.'}],onSave(v){P.diary.lock=String(v.lock||'').trim();}}),
 /* settings */
 calSel:el=>{T.calSel=el.dataset.v;renderScreen();},
 calMove:el=>{let m=T.calM+ +el.dataset.v,y=T.calY;if(m<1){m=12;y--;}if(m>12){m=1;y++;}T.calM=m;T.calY=y;T.calSel=isoOf(y,m,1);renderScreen();},
 calToday:()=>{const p=parseIso(calToday());T.calY=p.y;T.calM=p.m;T.calSel=calToday();renderScreen();},
 addEvent:()=>E.event({id:uid(),date:T.calSel||calToday(),time:'오전 10:00',title:'',place:'',note:'',color:'#007aff'},true),
 editEvent:el=>E.event(P.calendar.events.find(x=>x.id===el.dataset.id)),
 editLock:()=>E.lock(), editHome:()=>E.home(), editInfo:()=>E.info(),
 editApp:el=>E.app(P.home.apps.find(x=>x.id===el.dataset.id)),
 /* sheets */
 shCancel:()=>{const s=SHEETS[SHEETS.length-1];if(s&&s.cancelDrop)s.cancelDrop();popSheet();if(P)renderScreen();},
 shSave:()=>{const s=SHEETS[SHEETS.length-1];s&&s.doSave&&s.doSave();},
 shDelete:()=>{const s=SHEETS[SHEETS.length-1];openConfirm('지우기','지우면 되돌릴 수 없어요.','지우기',()=>{s.onDelete();popSheet(2);commit();});},
 shYes:()=>{const s=SHEETS[SHEETS.length-1];s.yes();},
 shExtra:el=>{const s=SHEETS[SHEETS.length-1];s.extra[+el.dataset.i].fn();},
 leEdit:el=>{const s=SHEETS[SHEETS.length-1];s.onEdit(+el.dataset.i);},
 leMove:el=>{const s=SHEETS[SHEETS.length-1];const a=s.get();const i=+el.dataset.i,j=i+ +el.dataset.d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];commit();drawSheet();},
 leAdd:()=>{const s=SHEETS[SHEETS.length-1];s.onAdd();},
 pickImg:el=>{const k=el.dataset.k;pick(async files=>{toast('사진을 올리는 중…');const r=await uploadImage(files[0]);if(r){setFieldVal(k,r);toast('사진을 넣었어요. 저장을 눌러 주세요.');}});},
 clearImg:el=>setFieldVal(el.dataset.k,''),
 setSw:el=>setFieldVal(el.dataset.k,el.dataset.v)
};
function webSearch(q,fromHist){
 q=String(q||'').trim(); if(!q) return;
 if(!editMode&&!fromHist) T.history.push({id:uid(),text:q});
 const n=norm(q); const exact=P.web.pages.find(p=>norm(p.url)===n||norm(p.title)===n);
 if(exact) push({s:'webpage',id:exact.id}); else push({s:'websearch',q});
}
const F={
 send:f=>{const t=thread(f.dataset.id);const i=$('#chatin');const text=i.value.trim();if(!text)return;i.value='';
  if(editMode){t.msgs.push({id:uid(),me:T.sendAs==='me',text,img:'',time:timeLabel(P.lock.time)});touch();renderChatLog();}
  else sendTemp(t,text); i.focus();},
 websearch:()=>{const i=$('#addrin');webSearch(i.value);},
 diaryPin:()=>{const v=$('#diarypin').value;if(v===P.diary.lock){T.diaryOpen=true;T.shake=false;renderScreen();}else{T.shake=true;renderScreen();setTimeout(()=>{T.shake=false;},450);}}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const f=A[el.dataset.a];if(f){e.preventDefault();f(el,e);}});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();F[f.dataset.form]?.(f);});
let bindT=null;
document.addEventListener('input',e=>{const el=e.target;
 if(el.classList.contains('cpick')){setFieldVal(el.dataset.k,el.value);return;}
 if(el.dataset.bind&&P){const [kind,id,field]=el.dataset.bind.split('|');const coll=kind==='note'?P.notes.items:P.diary.items;const o=coll.find(x=>x.id===id);if(o){o[field]=el.value;clearTimeout(bindT);bindT=setTimeout(touch,500);}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&SHEETS.length)A.shCancel();});
let swipeY=null, swipeX=null;
document.addEventListener('pointerdown',e=>{swipeY=e.target.closest('.lock')?e.clientY:null;swipeX=e.target.closest('[data-swipe="photo"]')?e.clientX:null;});
document.addEventListener('pointerup',e=>{
 if(swipeY!=null&&swipeY-e.clientY>40&&cur().s==='lock')unlock();
 if(swipeX!=null&&cur().s==='photo'){const dx=e.clientX-swipeX;if(Math.abs(dx)>45){const list=photoList(cur().ctx);const i=list.findIndex(x=>x.id===cur().id);const j=i+(dx<0?1:-1);if(j>=0&&j<list.length){cur().id=list[j].id;T.swipeDir=dx<0?'next':'prev';T.swiped=true;renderScreen();const v=document.querySelector('.pv');if(v){v.classList.add('slide-'+T.swipeDir);}}else T.swiped=true;}}
 swipeY=null;swipeX=null;});
document.addEventListener('keydown',e=>{if(!P||SHEETS.length||cur().s!=='photo'||!['ArrowLeft','ArrowRight'].includes(e.key))return;const list=photoList(cur().ctx);const i=list.findIndex(x=>x.id===cur().id);const j=i+(e.key==='ArrowRight'?1:-1);if(j>=0&&j<list.length){cur().id=list[j].id;renderScreen();}});

/* ---------------- boot ---------------- */
(async function boot(){
 const qp=STANDALONE&&!VIEWER?new URLSearchParams(location.search).get('p'):null;
 if(qp!=null){
  if(slugOk(qp)){ try{ const r=await fetch(qp+'.json',{cache:'no-cache'}); if(!r.ok) throw new Error('missing'); const o=await r.json(); const d=o&&o.phone?o.phone:o; if(!d||!d.lock||!d.home) throw new Error('bad'); VIEWER=true; READY=true; LOCAL=true; canWrite=false; PID='view'; P=normalize(d); document.title=P.name||document.title; render(); return; }catch(e){} }
  $('#app').innerHTML=`<main class="lib"><div class="empty"><b>휴대폰을 찾을 수 없어요</b>‘${esc(qp)}.json’ 파일이 사이트에 없어요. 파일을 저장소에 올렸는지, 이름이 링크와 같은지 확인해 주세요. 올린 직후라면 1~2분 뒤 다시 열어 보세요.</div></main>`; return;
 }
 if(STANDALONE&&!VIEWER&&isViewHash(location.hash.slice(1))){
  try{ const d=await unpackPhone(location.hash.slice(1)); VIEWER=true; READY=true; LOCAL=true; canWrite=false; PID='view'; P=normalize(d); document.title=P.name||document.title; render(); return; }
  catch(e){ $('#app').innerHTML='<main class="lib"><div class="empty"><b>링크를 열 수 없어요</b>링크가 중간에 잘렸거나 이 브라우저가 너무 오래됐어요. 링크 전체를 다시 복사해서 열어 보세요.</div></main>'; return; }
 }
 if(VIEWER){ READY=true; LOCAL=true; canWrite=false; PID='view'; P=normalize(clone(VIEWER_DATA)); document.title=P.name||document.title; render(); return; }
 render();
 const C=STANDALONE?null:window.claude; const use=n=>C&&C.use?C.use(n).catch(()=>null):Promise.resolve(null);
 const [db,assets,user]=await Promise.all([use('db'),use('assets'),use('user')]);
 DB=db; ASSETS=assets; USER=user; READY=true;
 if(!DB){ LOCAL=true; canWrite=false; }
 else { let c=null; try{ c=USER?await USER.can('data.write'):null; }catch(e){} canWrite=c!==false; }
 if(DB){ unsubList=DB.collection('phones').orderBy('updatedAt','desc').limit(300).onSnapshot(s=>{LIST=s.docs.map(d=>({id:d.id,...d.data()}));if(!PID)renderList();},()=>{LIST=LIST||[];if(!PID)renderList();}); }
 const h=readHash(); if(h) openPhoneId(h); else render();
 window.addEventListener('storage',e=>{ if(e.key===LKEY){ try{LOCALP=JSON.parse(e.newValue||'{}')||{};}catch(_){} if(!PID) renderList(); } });
})();
</script>
